name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write     # create the GitHub release
  packages: write     # push to ghcr.io

env:
  DOCKERHUB_IMAGE: cj0r/staffpicked

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the app's version
        run: |
          want="$(python -c 'import scripts; print(scripts.__version__)')"
          test "v$want" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but scripts/__init__.py says $want"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests -t .

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/staffpicked
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Build the amd64 image to test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: staffpicked:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test it before anything is pushed
        run: |
          docker run -d --name sp -p 9343:9343 staffpicked:test
          for i in $(seq 30); do curl -fs http://127.0.0.1:9343/api/health && exit 0; sleep 2; done
          docker logs sp; exit 1
      - name: Build amd64 + arm64 and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./docs/dockerhub.md

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " || $0 == "## "v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
