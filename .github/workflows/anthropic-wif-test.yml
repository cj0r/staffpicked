name: anthropic-wif-test
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01R3h8QdAgqGnQciDDpV6YBH",
            "organization_id": "9cf616ff-5da9-4b97-a3e5-fcef2b59825e",
            "service_account_id": "svac_012myoBFPP7s43NYcx8bsi31",
            "workspace_id": "wrkspc_018Uu1tJ5zkaY7KUEeiY18g5"
          }
          JSON
